# Full stack: SQL Server + API + web (nginx). Copy .env.example to .env and set the secrets first:
#   docker compose up -d --build   →   http://localhost:8080
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:-Developer}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      # The first start (creating the system databases) can take minutes on Docker Desktop for Windows/macOS.
      start_period: 180s
      start_interval: 5s
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      ConnectionStrings__Fatoura: "Server=mssql,1433;Database=Fatoura;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY (at least 32 characters) in .env}
      Seed__AdminEmail: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      Seed__AdminName: ${ADMIN_NAME:-Administrator}
    depends_on:
      mssql:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./clients
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mssql-data:
